[project]
name = "agentvault"
version = "0.1.0"
description = "Official Python SDK for AgentVault — let your AI agents spend money safely."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ai", "agents", "wallet", "fintech", "spending", "policy"]
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentvault*"]
