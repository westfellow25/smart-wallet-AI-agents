name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck API
        run: npm run typecheck -w @agentvault/api

      - name: Test policy engine
        run: npm test -w @agentvault/api

      - name: Build dashboard
        run: npm run build -w @agentvault/dashboard
